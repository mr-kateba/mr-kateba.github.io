<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kateba — أدوات بلازما واستوديو نخلة</title>
<meta name="description" content="أدوات ويندوز عربية مجانية ومفتوحة المصدر من تطوير kateba، وألعاب استوديو نخلة.">
<meta name="author" content="kateba (mr-kateba)">
<meta name="theme-color" content="#121216">
<link rel="icon" href="logos/boost.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/site.css?v=202611242358">
</head>
<body>

<div class="backdrop" id="backdrop" aria-hidden="true"></div>
<canvas id="embers" class="embers" aria-hidden="true"></canvas>

<main class="stage">
  <section class="card" id="card">
    <div class="avatar-wrap"><img id="avatar" class="avatar" src="assets/avatar.svg" alt=""></div>
    <h1 class="name">kateba</h1>
    <p class="bio">أدوات ويندوز عربية مجانية ومفتوحة المصدر، وألعاب من استوديو نخلة.</p>

    <nav class="tabs" role="tablist">
      <button class="tab active" role="tab" aria-selected="true" data-tab="tools">أدوات بلازما</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="games">ألعاب استوديو نخلة</button>
    </nav>
    <div class="panel active" id="tab-tools" role="tabpanel"><ul class="list" id="tools"></ul></div>
    <div class="panel" id="tab-games" role="tabpanel"><ul class="list" id="games"></ul></div>
  </section>
</main>

<footer class="player disabled" id="player">
  <div class="track">
    <div class="disc"><img id="cover" src="assets/avatar.svg" alt=""></div>
    <div class="meta"><div class="title" id="title">—</div><div class="artist" id="artist"></div></div>
  </div>
  <div class="controls">
    <button class="ctl" id="prev" aria-label="السابق"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>
    <button class="ctl play" id="play" aria-label="تشغيل"><svg viewBox="0 0 24 24"><path id="playPath" d="M8 5v14l11-7z"/></svg></button>
    <button class="ctl" id="next" aria-label="التالي"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
  </div>
  <div class="seek">
    <span class="time" id="cur">0:00</span>
    <input type="range" id="bar" min="0" max="1000" value="0" aria-label="التقدّم">
    <span class="time" id="dur">0:00</span>
  </div>
  <div class="extra">
    <button class="ctl small" id="mute" aria-label="كتم"><svg viewBox="0 0 24 24"><path id="volPath" d="M4 9v6h4l5 5V4L8 9zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button>
    <input type="range" id="vol" min="0" max="100" value="70" aria-label="الصوت">
    <button class="ctl small" id="listBtn" aria-label="قائمة الأناشيد"><svg viewBox="0 0 24 24"><path d="M3 6h12v2H3zm0 5h12v2H3zm0 5h8v2H3zm14-6v7.2A3 3 0 1 0 19 20V12h3v-2z"/></svg></button>
  </div>
  <div class="playlist" id="playlist" hidden>
    <div class="playlist-head">الأناشيد</div>
    <ol id="tracks"></ol>
  </div>
</footer>

<div class="video" id="video" hidden>
  <div id="ytFrame"></div>
  <button class="video-close" id="videoClose" aria-label="إيقاف"><svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg></button>
</div>
<audio id="audio" preload="metadata"></audio>
<script src="assets/site.js?v=202611242358"></script>
</body>
</html>
